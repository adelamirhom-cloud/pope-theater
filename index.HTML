<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حجز مقاعد مسرح المقر البابوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <meta name="theme-color" content="#2c3e50">

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            margin: 0; text-align: center; color: #2c3e50; padding-bottom: 30px; 
        }

        /* العداد التنازلي */
        .countdown-bar {
            background: linear-gradient(90deg, #1a252f, #2c3e50);
            color: #f1c40f; padding: 15px 10px; display: flex; justify-content: center;
            align-items: center; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 25px; border-bottom: 2px solid #f39c12;
        }
        .cd-box { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
        .cd-number { font-size: 24px; font-weight: 700; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 8px; margin-bottom: 5px;}
        .cd-label { font-size: 12px; color: #bdc3c7; }
        .cd-title { font-size: 18px; font-weight: bold; margin-left: 20px; color: white; border-left: 2px solid #555; padding-left: 20px;}
        
        .theater-wrapper {
            max-width: 1250px; margin: 0 auto; background-color: #ffffff; padding: 25px; 
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
        }
        
        /* تحسين التمرير وإخفاء الشريط الأفقي */
        .scroll-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; direction: rtl; padding-bottom: 20px; scroll-behavior: smooth; }
        .scroll-container::-webkit-scrollbar { display: none; }
        .scroll-container { -ms-overflow-style: none; scrollbar-width: none; }
        
        .theater-inner { min-width: 1150px; margin: 0 auto; direction: ltr; }
        
        .stage-top { 
            background: linear-gradient(145deg, #8d6e63, #5d4037); color: #ffecb3; font-size: 28px; 
            font-weight: 700; padding: 20px; margin-bottom: 35px; border-radius: 12px 12px 60px 60px; 
            box-shadow: 0 8px 15px rgba(93, 64, 55, 0.3), inset 0 -3px 10px rgba(0,0,0,0.2); letter-spacing: 2px;
        }

        #seating-area { display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .seat-group { display: flex; gap: 6px; }
        
        .seat { 
            width: 34px; height: 34px; background: linear-gradient(145deg, #f0f0f0, #cacaca);
            border: 1px solid #bcbcbc; border-radius: 8px; display: flex; justify-content: center; 
            align-items: center; font-size: 13px; font-weight: 700; color: #444; cursor: pointer; 
            transition: all 0.2s; user-select: none; flex-shrink: 0; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); position: relative; 
        }
        
        /* التلميحات Tooltips */
        .seat::after {
            content: attr(data-info); position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
            background: rgba(33, 47, 61, 0.95); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap;
            opacity: 0; visibility: hidden; pointer-events: none; transition: 0.2s ease-in-out; z-index: 100; font-weight: 400;
        }
        .seat::before {
            content: ''; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
            border-width: 5px; border-style: solid; border-color: rgba(33, 47, 61, 0.95) transparent transparent transparent;
            opacity: 0; visibility: hidden; transition: 0.2s; z-index: 100;
        }
        .seat:hover:not(.hidden-seat)::after, .seat:hover:not(.hidden-seat)::before { opacity: 1; visibility: visible; }
        .seat:hover:not(.booked):not(.empty-x):not(.hidden-seat):not(.mixer-block):not(.locked) { 
            background: linear-gradient(145deg, #e2e2e2, #b8b8b8); transform: translateY(-3px) scale(1.05); 
        }

        .seat.selected { background: linear-gradient(145deg, #4CAF50, #2E7D32); color: white; border-color: #1B5E20; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }
        .seat.booked { background: linear-gradient(145deg, #ef5350, #c62828); color: white; border-color: #b71c1c; cursor: not-allowed; opacity: 0.8; pointer-events: none; }
        .seat.locked { background: linear-gradient(145deg, #f1c40f, #f39c12); color: white; border-color: #e67e22; cursor: not-allowed; opacity: 0.9; pointer-events: none; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: 0 0 10px #f39c12; } 100% { opacity: 0.8; } }

        .seat.hidden-seat { background: transparent; pointer-events: none; color: transparent; border: none; box-shadow: none; }
        .seat.empty-x { background: #eceff1; color: #b0bec5; border-color: #cfd8dc; pointer-events: none; }
        .seat.mixer-block { width: 154px; background: linear-gradient(145deg, #2c3e50, #1a252f); color: #f1c40f; border-color: #111; font-size: 16px; pointer-events: none; letter-spacing: 3px; flex-shrink: 0; }

        .row-label { width: 34px; height: 34px; background: #34495e; color: white; font-weight: 700; display: flex; justify-content: center; align-items: center; border-radius: 6px; font-size: 14px; flex-shrink: 0; }
        .door-divider { width: 100%; margin: 20px 0; padding: 10px; background: rgba(255, 243, 224, 0.7); color: #d35400; font-weight: 700; font-size: 18px; border-radius: 8px; display: flex; justify-content: center; align-items: center; border: 2px dashed #f39c12; }
        .side-indicator { width: 85px; height: 34px; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
        .stairs-indicator { background: linear-gradient(90deg, #795548, #5d4037); color: white; border-right: 4px solid #3e2723; }
        .stairs-indicator.first { border-top-left-radius: 10px; border-top-right-radius: 10px; }
        .stairs-indicator.last { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; }
        .door-indicator { background: #fff3e0; color: #e65100; border: 2px dashed #ffb300; border-radius: 8px; }

        .legend { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 35px; padding-top: 25px; border-top: 2px solid #ecf0f1; direction: rtl; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #34495e; }
        .legend-box { width: 24px; height: 24px; border-radius: 6px; box-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
        
        .booking-form { margin-top: 35px; padding: 30px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 15px; display: flex; flex-direction: column; align-items: center; gap: 20px; direction: rtl; }
        .input-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .booking-form input { padding: 14px 20px; font-size: 16px; border: 2px solid #dee2e6; border-radius: 10px; width: 260px; font-family: inherit; font-weight: 600; text-align: center; color: #2c3e50; text-transform: uppercase; letter-spacing: 2px; }
        .summary-text { font-size: 20px; font-weight: 700; color: #2980b9; background: #ebf5fb; padding: 10px 25px; border-radius: 30px; }
        
        button.book-btn { background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; padding: 14px 45px; font-size: 18px; border-radius: 10px; cursor: pointer; font-weight: 700; font-family: inherit; display: flex; gap: 10px; align-items: center; }
        .spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 3px solid #fff; width: 18px; height: 18px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .sys-footer { margin-top: 25px; font-size: 14px; font-weight: 700; color: #95a5a6; letter-spacing: 1px; }

        /* التذكرة */
        .ticket-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .ticket-capture-area { background: #fff; width: 90%; max-width: 350px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; margin-bottom: 15px; }
        .ticket-header { background: #2c3e50; color: #f1c40f; padding: 20px; text-align: center; font-size: 22px; font-weight: 700; }
        .ticket-body { padding: 25px 20px; text-align: right; }
        .ticket-row { display: flex; justify-content: space-between; border-bottom: 1px dashed #ccc; padding: 10px 0; margin-bottom: 10px;}
        .ticket-label { color: #7f8c8d; font-size: 14px; }
        .ticket-value { color: #2c3e50; font-weight: 700; font-size: 16px; }
        .qr-container { display: flex; justify-content: center; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 10px; }
        .ticket-footer { text-align: center; padding: 12px; background: #ecf0f1; font-size: 12px; font-weight: 700; color: #7f8c8d; border-top: 1px solid #bdc3c7;}
        
        .ticket-buttons-wrapper { width: 90%; max-width: 350px; display: flex; gap: 10px; }
        .share-btn { flex: 1; padding: 14px; background: #25D366; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .close-ticket-btn { flex: 1; padding: 14px; background: #e74c3c; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }

        /* تعديلات الموبايل الرايقة */
        @media (max-width: 768px) {
            body { padding-bottom: 300px; padding-top: 0; margin: 0; }
            .theater-wrapper { padding: 15px 5px; border-radius: 0; box-shadow: none; }
            .countdown-bar { flex-wrap: wrap; gap: 10px; padding: 15px 10px; margin-bottom: 15px; }
            .cd-title { border: none; padding: 0; margin: 0; width: 100%; font-size: 16px; margin-bottom: 5px; text-align: center; }
            .cd-number { font-size: 20px; padding: 5px 10px; }
            .stage-top { font-size: 20px; padding: 15px; margin-bottom: 25px; border-radius: 8px 8px 40px 40px; }
            .legend { gap: 12px; padding-top: 15px; margin-top: 20px; font-size: 12px; justify-content: center; }
            .legend-item { font-size: 12px; }
            .legend-box { width: 18px; height: 18px; }
            
            /* الفورم الزجاجي العائم أسفل الشاشة */
            .booking-form { 
                position: fixed; bottom: 0; left: 0; right: 0; margin: 0; 
                border-radius: 25px 25px 0 0; padding: 20px 15px; z-index: 1000; 
                background: rgba(255, 255, 255, 0.95); 
                backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
                box-shadow: 0 -10px 25px rgba(0,0,0,0.1); border-top: 1px solid rgba(255,255,255,0.6);
            }
            .summary-text { font-size: 16px; padding: 8px 15px; width: 100%; box-sizing: border-box; margin-bottom: 10px;}
            .booking-form input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; }
            .input-group { flex-direction: column; gap: 10px; width: 100%; }
            button.book-btn { width: 100%; justify-content: center; padding: 14px; font-size: 18px; border-radius: 12px; margin-top: 5px;}
            .sys-footer { display: none; }
        }
    </style>
</head>

            "D1F9M4", "L3C2P7", "X5M8V1", "T8F3C6", "C4V7K2", "B5P1M9", "P7D6V4", "V3C9F8", "M6K2P5", "R4V8M1",

        ];

        const layout = [
            { row: 'A', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,-1] },
            { row: 'B', farOdd: [-1,-1,-1,-1], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'C', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'D', farOdd: [-1,-1,-1,-1], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { isDivider: true, text: 'ممر عرضي' },
            { row: 'E', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'F', farOdd: [-1,-1,-1,-1], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'G', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,-1] },
            { row: 'H', farOdd: [-1,-1,-1,-1], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'I', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'J', farOdd: ['MIXER'],     mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'K', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'L', farOdd: [0,21,19,17],  mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'M', farOdd: [23,21,19,17], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'N', farOdd: [23,21,19,17], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'O', farOdd: [0,21,19,17],  mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'P', farOdd: [0,21,19,17],  mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'Q', farOdd: [23,21,19,17], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'R', farOdd: [23,21,19,17], mainOdd: [0,0,0,9,7,5,3,1],    mainEven: [2,4,6,8,10,0,0],   farEven: [16,18,20,22] }
        ];

        const seatingArea = document.getElementById('seating-area');
        let selectedSeats = [];
        let globalLocks = {}; 

        function updateCountdown() {
            const eventDate = new Date("2026-09-22T19:00:00").getTime();
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) return;
            document.getElementById("cd-days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("cd-hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("cd-mins").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById("cd-secs").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function generateSeats() {
            layout.forEach(rowData => {
                if (rowData.isDivider) {
                    const div = document.createElement('div'); div.className = 'door-divider'; div.innerText = rowData.text;
                    seatingArea.appendChild(div); return;
                }
                const rowDiv = document.createElement('div'); rowDiv.className = 'row';
                const leftIndicator = document.createElement('div'); leftIndicator.className = 'side-indicator';
                if (['A','B','C','D'].includes(rowData.row)) {
                    leftIndicator.classList.add('stairs-indicator');
                    if (rowData.row === 'A') leftIndicator.classList.add('first');
                    if (rowData.row === 'D') leftIndicator.classList.add('last');
                    if (rowData.row === 'B') leftIndicator.innerHTML = '<span>سلم</span>';
                    if (rowData.row === 'C') leftIndicator.innerHTML = '<span>المسرح</span>';
                } else if (rowData.row === 'E') { leftIndicator.classList.add('door-indicator'); leftIndicator.innerHTML = '<span>🚪 الباب</span>'; }
                rowDiv.appendChild(leftIndicator);

                const farOddGroup = document.createElement('div'); farOddGroup.className = 'seat-group';
                rowData.farOdd.forEach(num => farOddGroup.appendChild(createSeatElement(rowData.row, num))); rowDiv.appendChild(farOddGroup);

                const leftAisle = document.createElement('div'); leftAisle.className = 'row-label'; leftAisle.innerText = rowData.row; rowDiv.appendChild(leftAisle);

                const mainOddGroup = document.createElement('div'); mainOddGroup.className = 'seat-group';
                rowData.mainOdd.forEach(num => mainOddGroup.appendChild(createSeatElement(rowData.row, num))); rowDiv.appendChild(mainOddGroup);

                const mainEvenGroup = document.createElement('div'); mainEvenGroup.className = 'seat-group';
                rowData.mainEven.forEach(num => mainEvenGroup.appendChild(createSeatElement(rowData.row, num))); rowDiv.appendChild(mainEvenGroup);

                const rightAisle = document.createElement('div'); rightAisle.className = 'row-label'; rightAisle.innerText = rowData.row; rowDiv.appendChild(rightAisle);

                const farEvenGroup = document.createElement('div'); farEvenGroup.className = 'seat-group';
                rowData.farEven.forEach(num => farEvenGroup.appendChild(createSeatElement(rowData.row, num))); rowDiv.appendChild(farEvenGroup);

                seatingArea.appendChild(rowDiv);
            });
        }

        function createSeatElement(row, num) {
            const seat = document.createElement('div');
            if (num === -1) { seat.className = 'seat hidden-seat'; return seat; }
            if (num === 0) { seat.className = 'seat empty-x'; seat.innerText = 'X'; seat.setAttribute('data-info', 'غير متاح'); return seat; }
            if (num === 'MIXER') { seat.className = 'seat mixer-block'; seat.innerText = 'ميكسر'; seat.setAttribute('data-info', 'ميكسر الصوت'); return seat; }

            seat.className = 'seat'; seat.innerText = num;
            const seatId = `${row}${num}`; seat.id = `seat-${seatId}`;
            seat.setAttribute('data-info', `مقعد ${seatId} - متاح`);

            seat.addEventListener('click', async () => {
                if(seat.classList.contains('booked')) return;
                
                if (!seat.classList.contains('selected')) {
                    if (selectedSeats.length >= 1) {
                        Swal.fire({ icon: 'warning', title: 'عفواً', text: 'يسمح بحجز مقعد واحد فقط لكل تيكت.', confirmButtonColor: '#3498db' });
                        return;
                    }

                    const lockRef = ref(db, 'lockedSeats/' + seatId);
                    const snap = await get(lockRef);
                    if (snap.exists()) {
                        const lockData = snap.val();
                        if (Date.now() - lockData.timestamp < 60000 && lockData.sessionId !== mySessionId) {
                            Swal.fire({ icon: 'warning', title: 'الكرسي غير متاح', text: 'هذا الكرسي يقوم شخص آخر بحجزه الآن، يرجى اختيار كرسي آخر.', confirmButtonColor: '#f39c12' });
                            return;
                        }
                    }

                    await set(lockRef, { timestamp: Date.now(), sessionId: mySessionId });
                    
                    seat.classList.add('selected'); 
                    selectedSeats.push(seatId);
                } else {
                    seat.classList.remove('selected'); 
                    selectedSeats = selectedSeats.filter(id => id !== seatId);
                    remove(ref(db, 'lockedSeats/' + seatId));
                }
                updateSummary();
            });
            return seat;
        }

        function updateSummary() {
            const summaryText = document.getElementById('selected-seats-list');
            if (selectedSeats.length > 0) { summaryText.innerText = "المقعد المحدد: " + selectedSeats[0]; } 
            else { summaryText.innerText = "لم يتم تحديد مقعد بعد"; }
        }

        function listenToLocks() {
            onValue(ref(db, 'lockedSeats'), (snapshot) => {
                globalLocks = snapshot.val() || {};
                renderLocks();
            });
        }

        function renderLocks() {
            const now = Date.now();
            document.querySelectorAll('.seat.locked').forEach(s => {
                s.classList.remove('locked');
                s.setAttribute('data-info', `مقعد ${s.id.replace('seat-','')} - متاح`);
            });

            for (let seatId in globalLocks) {
                const lockData = globalLocks[seatId];
                if (now - lockData.timestamp < 60000) {
                    if (lockData.sessionId !== mySessionId) {
                        const seatEl = document.getElementById(`seat-${seatId}`);
                        if(seatEl && !seatEl.classList.contains('booked') && !seatEl.classList.contains('selected')) {
                            seatEl.classList.add('locked');
                            seatEl.setAttribute('data-info', 'جاري حجزه الآن (مغلق مؤقتاً)');
                        }
                    }
                }
            }
        }
        setInterval(renderLocks, 5000);

        function listenToBookings() {
            onValue(ref(db, 'bookings'), (snapshot) => {
                const data = snapshot.val() || {}; const bookedSeatsList = Object.keys(data);
                
                document.querySelectorAll('.seat.booked').forEach(seat => { 
                    seat.classList.remove('booked'); 
                    seat.setAttribute('data-info', `مقعد ${seat.id.replace('seat-','')} - متاح`);
                });
                
                bookedSeatsList.forEach(seatId => {
                    const seatElement = document.getElementById(`seat-${seatId}`);
                    if (seatElement) { 
                        seatElement.classList.remove('selected'); 
                        seatElement.classList.remove('locked'); 
                        seatElement.classList.add('booked'); 
                        seatElement.setAttribute('data-info', `مقعد ${seatId} - محجوز`);
                    }
                });
                selectedSeats = selectedSeats.filter(seatId => !bookedSeatsList.includes(seatId));
                updateSummary();
            });
        }

        window.showTicket = function(name, seat, code) {
            document.getElementById('t-name').innerText = name;
            document.getElementById('t-seat').innerText = seat;
            document.getElementById('t-code').innerText = code;
            document.getElementById('qrcode').innerHTML = ""; 
            new QRCode(document.getElementById("qrcode"), { text: code, width: 120, height: 120, colorDark : "#2c3e50", colorLight : "#f8f9fa" });
            document.getElementById('ticket-modal').style.display = 'flex';
        }
        window.closeTicket = function() { document.getElementById('ticket-modal').style.display = 'none'; }
        
        window.shareFullTicket = async function() {
            const shareBtn = document.getElementById('share-btn');
            const originalText = shareBtn.innerText; shareBtn.innerText = 'جاري المعالجة... ⏳'; shareBtn.disabled = true;
            const ticketArea = document.getElementById('ticket-capture-area');
            const seat = document.getElementById('t-seat').innerText;

            try {
                const canvas = await html2canvas(ticketArea, { scale: 2, backgroundColor: '#ffffff' });
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `Ticket_${seat}.png`, { type: 'image/png' });
                    const shareText = `تذكرتي لمسرح المقر البابوي 🎭\nنراكم يوم 22/9/2026!`;

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ title: 'تذكرة مسرح المقر', text: shareText, files: [file] });
                    } else {
                        const link = document.createElement('a'); link.href = canvas.toDataURL('image/png'); link.download = `Ticket_${seat}.png`; link.click();
                        Swal.fire({ icon: 'success', title: 'تم حفظ التذكرة', confirmButtonColor: '#2ecc71' });
                    }
                    shareBtn.innerText = originalText; shareBtn.disabled = false;
                }, 'image/png');
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'حدث خطأ أثناء معالجة الصورة.', confirmButtonColor: '#e74c3c' });
                shareBtn.innerText = originalText; shareBtn.disabled = false;
            }
        }

        document.getElementById('confirm-btn').addEventListener('click', async () => {
            const userName = document.getElementById('user-name').value.trim();
            const ticketCode = document.getElementById('ticket-code').value.trim().toUpperCase();

            if(selectedSeats.length === 0) { Swal.fire({ icon: 'error', title: 'خطأ', text: 'حدد مقعداً أولاً.', confirmButtonColor: '#e74c3c' }); return; }
            if(!userName || !ticketCode) { Swal.fire({ icon: 'warning', title: 'بيانات ناقصة', text: 'أدخل الاسم والكود.', confirmButtonColor: '#f39c12' }); return; }
            if (!validTicketCodes.includes(ticketCode)) { Swal.fire({ icon: 'error', title: 'كود غير صحيح', text: 'عفواً، كود التيكت هذا غير صحيح أو غير مسجل في النظام.', confirmButtonColor: '#e74c3c' }); return; }

            const confirmBtn = document.getElementById('confirm-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            confirmBtn.disabled = true; btnText.innerText = "جاري التحقق..."; btnSpinner.style.display = "block";

            try {
                const codeRef = ref(db, 'usedCodes/' + ticketCode);
                const snapshot = await get(codeRef);

                if (snapshot.exists()) {
                    Swal.fire({ icon: 'error', title: 'مستخدم مسبقاً', text: 'هذا الكود تم استخدامه بالفعل!', confirmButtonColor: '#e74c3c' });
                    resetButton(); return;
                }

                const seatId = selectedSeats[0];
                const updates = {};
                updates['/bookings/' + seatId] = { name: userName, code: ticketCode, bookedAt: new Date().toISOString(), status: "confirmed" };
                updates['/usedCodes/' + ticketCode] = true;
                updates['/lockedSeats/' + seatId] = null; 

                await update(ref(db), updates);

                showTicket(userName, seatId, ticketCode);
                
                selectedSeats = [];
                document.getElementById('user-name').value = '';
                document.getElementById('ticket-code').value = '';
                updateSummary();

            } catch (error) {
                Swal.fire({ icon: 'error', title: 'حدث خطأ', text: error.message, confirmButtonColor: '#e74c3c' });
            } finally {
                resetButton();
            }

            function resetButton() { confirmBtn.disabled = false; btnText.innerText = "تأكيد الحجز"; btnSpinner.style.display = "none"; }
        });

        // تشغيل الوظائف الأساسية
        generateSeats(); 
        listenToBookings(); 
        listenToLocks();
    </script>
