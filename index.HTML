<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شباك التذاكر (POS) | مسرح المقر البابوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --bg: #f5f7fa; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); margin: 0; color: #333; }
        
        .header { background: linear-gradient(135deg, var(--primary), #34495e); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .header p { margin: 5px 0 0 0; color: #bdc3c7; font-size: 13px; }
        
        .pos-badge { background: #f1c40f; color: #2c3e50; padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }

        /* أزرار التبديل بين الصالة والبلكونة */
        .floor-toggle { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .floor-btn { padding: 12px 25px; border: 2px solid var(--primary); background: transparent; color: var(--primary); border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; font-family: inherit;}
        .floor-btn.active { background: var(--primary); color: white; }
        .floor-btn:hover:not(.active) { background: #ecf0f1; }

        .legend-bar { background: white; max-width: 800px; margin: 0 auto 30px auto; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 14px; }
        .legend-box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #ccc; }

        .map-container { background: #fff; max-width: 1200px; margin: 0 auto; border-radius: 15px; padding: 30px 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow-x: auto; direction: rtl; }
        .stage-top { background: linear-gradient(145deg, #8d6e63, #5d4037); color: #ffecb3; font-size: 24px; font-weight: 700; padding: 15px; margin: 0 auto 40px auto; border-radius: 8px 8px 40px 40px; text-align: center; width: 80%; max-width: 600px; letter-spacing: 2px; transition: 0.3s;}
        
        .seating-area { display: flex; flex-direction: column; gap: 6px; align-items: center; min-width: 1000px; }
        .row { display: flex; justify-content: center; align-items: center; gap: 10px; }
        .seat-group { display: flex; gap: 4px; }
        .seat { width: 32px; height: 32px; border: 2px solid #bdc3c7; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 800; color: #34495e; background: #ecf0f1; transition: 0.2s; cursor: pointer; flex-shrink: 0; }
        .seat:hover { transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-color: var(--primary); z-index: 10; }
        
        .row-label { width: 32px; height: 32px; background: #34495e; color: white; font-weight: 700; display: flex; justify-content: center; align-items: center; border-radius: 4px; font-size: 14px; flex-shrink: 0; }
        
        .seat.booked { background: var(--danger); color: white; border-color: #c0392b; cursor: not-allowed; pointer-events: none; opacity: 0.7; }
        .seat.hidden-seat { background: transparent; color: transparent; border: none; pointer-events: none; }
        .seat.empty-x { background: #eceff1; color: #b0bec5; border-color: #cfd8dc; pointer-events: none; }
        .seat.mixer-block { width: 140px; background: #2c3e50; color: #f1c40f; font-size: 13px; pointer-events: none; border-color: #111; }
        
        .swal2-input { font-family: 'Cairo', sans-serif !important; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>🎟️ شباك التذاكر (Point of Sale)</h1>
            <p>نظام الحجز المباشر - Rave Technology Solutions</p>
        </div>
        <div class="pos-badge">حساب الكاشير النشط</div>
    </div>

    <!-- أزرار التبديل -->
    <div class="floor-toggle">
        <button id="btn-main" class="floor-btn active" onclick="switchFloor('main')">الصالة الرئيسية</button>
        <button id="btn-balcony" class="floor-btn" onclick="switchFloor('balcony')">البلكونة (70 مقعد)</button>
    </div>

    <div class="legend-bar">
        <div class="legend-item"><div class="legend-box" style="background: #ecf0f1; border-color: #bdc3c7;"></div> متاح للحجز</div>
        <div class="legend-item"><div class="legend-box" style="background: #e74c3c; border-color: #c0392b;"></div> محجوز وغير متاح</div>
    </div>

    <div class="map-container">
        <div id="stage-display" class="stage-top">خشبة المسرح</div>
        <div id="map-seating-area" class="seating-area" dir="ltr"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFsvO799G0wlZiRjD4g5GiRGIZm27ANzw",
            authDomain: "test-49b8c.firebaseapp.com",
            projectId: "test-49b8c",
            storageBucket: "test-49b8c.firebasestorage.app",
            messagingSenderId: "658085082590",
            appId: "1:658085082590:web:632f798dca5a87e2da994f",
            measurementId: "G-G0SHP0PBR0",
            databaseURL: "https://test-49b8c-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let bookingsData = {};
        let currentFloor = 'main'; // المتغير المسئول عن تحديد إحنا في أي دور

        // خريطة الصالة الرئيسية (403 كرسي)
        const theaterLayout = [
            { row: 'A', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,-1] },
            { row: 'B', farOdd: [-1,-1,-1,-1], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'C', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'D', farOdd: [-1,-1,-1,-1], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'E', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'F', farOdd: [-1,-1,-1,-1], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'G', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,-1] },
            { row: 'H', farOdd: [-1,-1,-1,-1], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'I', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'J', farOdd: ['MIXER'],     mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'K', farOdd: [-1,-1,-1,-1], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'L', farOdd: [0,21,19,17],  mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'M', farOdd: [23,21,19,17], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'N', farOdd: [23,21,19,17], mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'O', farOdd: [0,21,19,17],  mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'P', farOdd: [0,21,19,17],  mainOdd: [0,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,0] },
            { row: 'Q', farOdd: [23,21,19,17], mainOdd: [15,13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [16,18,20,22] },
            { row: 'R', farOdd: [23,21,19,17], mainOdd: [0,0,0,9,7,5,3,1],    mainEven: [2,4,6,8,10,0,0],   farEven: [16,18,20,22] }
        ];

        // خريطة البلكونة (70 كرسي)
        const balconyLayout = [
            { row: 'BA', farOdd: [], mainOdd: [13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [] },
            { row: 'BB', farOdd: [], mainOdd: [13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [] },
            { row: 'BC', farOdd: [], mainOdd: [13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [] },
            { row: 'BD', farOdd: [], mainOdd: [13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [] },
            { row: 'BE', farOdd: [], mainOdd: [13,11,9,7,5,3,1], mainEven: [2,4,6,8,10,12,14], farEven: [] }
        ];

        window.switchFloor = function(floor) {
            currentFloor = floor;
            document.getElementById('btn-main').classList.toggle('active', floor === 'main');
            document.getElementById('btn-balcony').classList.toggle('active', floor === 'balcony');
            
            // تغيير اسم الاستيدج لتوضيح إننا في البلكونة
            const stage = document.getElementById('stage-display');
            if(floor === 'balcony') {
                stage.innerText = 'سور البلكونة الأمامي';
                stage.style.background = 'linear-gradient(145deg, #7f8c8d, #34495e)';
            } else {
                stage.innerText = 'خشبة المسرح';
                stage.style.background = 'linear-gradient(145deg, #8d6e63, #5d4037)';
            }
            
            renderMap();
        }

        onValue(ref(db, 'bookings'), (snapshot) => {
            bookingsData = snapshot.val() || {};
            renderMap();
        });

        function renderMap() {
            const mapArea = document.getElementById('map-seating-area');
            mapArea.innerHTML = '';

            const activeLayout = currentFloor === 'main' ? theaterLayout : balconyLayout;

            activeLayout.forEach(rowData => {
                const rowDiv = document.createElement('div'); rowDiv.className = 'row';
                
                const farOddGroup = document.createElement('div'); farOddGroup.className = 'seat-group';
                rowData.farOdd.forEach(num => farOddGroup.appendChild(createSeat(rowData.row, num)));
                rowDiv.appendChild(farOddGroup);

                const leftAisle = document.createElement('div'); leftAisle.className = 'row-label'; leftAisle.innerText = rowData.row;
                rowDiv.appendChild(leftAisle);

                const mainOddGroup = document.createElement('div'); mainOddGroup.className = 'seat-group';
                rowData.mainOdd.forEach(num => mainOddGroup.appendChild(createSeat(rowData.row, num)));
                rowDiv.appendChild(mainOddGroup);

                const mainEvenGroup = document.createElement('div'); mainEvenGroup.className = 'seat-group';
                rowData.mainEven.forEach(num => mainEvenGroup.appendChild(createSeat(rowData.row, num)));
                rowDiv.appendChild(mainEvenGroup);

                const rightAisle = document.createElement('div'); rightAisle.className = 'row-label'; rightAisle.innerText = rowData.row;
                rowDiv.appendChild(rightAisle);

                const farEvenGroup = document.createElement('div'); farEvenGroup.className = 'seat-group';
                rowData.farEven.forEach(num => farEvenGroup.appendChild(createSeat(rowData.row, num)));
                rowDiv.appendChild(farEvenGroup);

                mapArea.appendChild(rowDiv);
            });
        }

        function createSeat(row, num) {
            const seat = document.createElement('div');
            if (num === -1) { seat.className = 'seat hidden-seat'; return seat; }
            if (num === 0) { seat.className = 'seat empty-x'; seat.innerText = 'X'; return seat; }
            if (num === 'MIXER') { seat.className = 'seat mixer-block'; seat.innerText = 'ميكسر'; return seat; }

            const seatId = `${row}${num}`;
            seat.className = 'seat';
            seat.innerText = num;

            if (bookingsData[seatId]) {
                seat.classList.add('booked');
                seat.innerText = 'X'; 
            } else {
                seat.onclick = () => openBookingForm(seatId);
            }

            return seat;
        }

        window.openBookingForm = async function(seatId) {
            const { value: formValues } = await Swal.fire({
                title: `حجز مقعد ${seatId}`,
                html: `
                    <p style="font-size: 14px; color: #7f8c8d; margin-top: 0;">يتم الحجز من شباك التذاكر (كاش)</p>
                    <input id="swal-name" class="swal2-input" placeholder="اكتب اسم العميل (مطلوب)" autocomplete="off">
                    <input id="swal-phone" class="swal2-input" placeholder="رقم الموبايل (اختياري)" autocomplete="off">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'تأكيد الحجز',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#27ae60',
                preConfirm: () => {
                    const name = document.getElementById('swal-name').value.trim();
                    if (!name) {
                        Swal.showValidationMessage('يجب كتابة اسم العميل لإتمام الحجز');
                        return false;
                    }
                    return {
                        name: name,
                        phone: document.getElementById('swal-phone').value.trim()
                    }
                }
            });

            if (formValues) {
                const randomCode = 'POS-' + Math.floor(1000 + Math.random() * 9000);
                const seatRef = ref(db, `bookings/${seatId}`);
                const snap = await get(seatRef);
                if (snap.exists()) {
                    return Swal.fire('عفواً', 'تم حجز هذا المقعد للتو من شباك آخر!', 'error');
                }

                try {
                    await update(ref(db), {
                        [`/bookings/${seatId}`]: {
                            name: formValues.name,
                            phone: formValues.phone || '',
                            code: randomCode,
                            bookedAt: new Date().toISOString(),
                            status: 'confirmed',
                            source: 'pos' 
                        }
                    });

                    Swal.fire({
                        icon: 'success',
                        title: 'تم الحجز بنجاح!',
                        html: `تم تسجيل مقعد <b>${seatId}</b> للعميل <b>${formValues.name}</b><br><br>كود التذكرة: <b style="color:#27ae60; font-size: 20px;">${randomCode}</b>`,
                        confirmButtonColor: '#2c3e50',
                        confirmButtonText: 'حسناً'
                    });

                } catch (error) {
                    Swal.fire('خطأ', 'حدثت مشكلة في الاتصال بالإنترنت أثناء الحجز.', 'error');
                }
            }
        }
    </script>
</body>
</html>
