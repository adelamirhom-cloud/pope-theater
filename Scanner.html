<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماسح التذاكر - مسرح المقر البابوي</title>
    
    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <!-- حماية من محركات البحث -->
    <meta name="robots" content="noindex, nofollow">

    <!-- PWA Meta Tags (تطبيق الويب التقدمي للماسح) -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%D9%85%D8%A7%D8%B3%D8%AD%20%D8%A7%D9%84%D8%AA%D8%B0%D8%A7%D9%83%D8%B1%22%2C%22short_name%22%3A%22%D8%A7%D9%84%D9%85%D8%A7%D8%B3%D8%AD%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231e293b%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F2415%2F2415284.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1e293b; margin: 0; padding: 0; color: white; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { width: 100%; background: #0f172a; padding: 20px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 22px; color: #f1c40f; letter-spacing: 1px; }
        .header p { margin: 5px 0 0 0; color: #94a3b8; font-size: 14px; }

        .scanner-container { width: 90%; max-width: 500px; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px; }
        #reader { width: 100%; }
        #reader__dashboard_section_csr span { color: #333 !important; font-family: 'Cairo', sans-serif; }
        #reader__dashboard_section_swaplink { color: #3498db !important; text-decoration: none; font-weight: bold; }
        #reader button { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-family: 'Cairo'; cursor: pointer; margin: 5px; }

        .status-box { background: #334155; padding: 20px; border-radius: 12px; width: 90%; max-width: 460px; box-sizing: border-box; border: 1px solid #475569; }
        .status-box h3 { margin: 0 0 10px 0; color: #cbd5e1; }
        
        #rescan-btn { display: none; background: #f1c40f; color: #0f172a; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; font-family: inherit; }
        .sys-footer { margin-top: auto; padding: 20px; font-size: 12px; color: #64748b; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>الماسح الأمني (Scanner)</h1>
        <p>قم بتوجيه الكاميرا نحو تذكرة الزائر للتحقق وتسجيل الدخول</p>
    </div>

    <div class="scanner-container">
        <div id="reader"></div>
    </div>

    <div class="status-box">
        <h3>حالة الماسح</h3>
        <p id="status-text" style="color: #34d399; font-weight: bold;">جاهز للمسح، بانتظار تذكرة...</p>
        <button id="rescan-btn" onclick="startScanning()">امسح تذكرة جديدة</button>
    </div>

    <div class="sys-footer">System Powered by Rave Technology</div>

    <!-- كود الـ PWA لجعل الماسح تطبيق -->
    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install', (e) => { self.skipWaiting(); }); self.addEventListener('fetch', (e) => { });`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        // تمت إضافة update لتحديث حالة التذكرة بعد المسح
        import { getDatabase, ref, query, orderByChild, equalTo, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFsvO799G0wlZiRjD4g5GiRGIZm27ANzw",
            authDomain: "test-49b8c.firebaseapp.com",
            projectId: "test-49b8c",
            storageBucket: "test-49b8c.firebasestorage.app",
            messagingSenderId: "658085082590",
            appId: "1:658085082590:web:632f798dca5a87e2da994f",
            measurementId: "G-G0SHP0PBR0",
            databaseURL: "https://test-49b8c-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let html5QrcodeScanner;
        let isProcessing = false; 

        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false
            );
            startScanning();
        }

        window.startScanning = function() {
            isProcessing = false;
            document.getElementById('rescan-btn').style.display = 'none';
            document.getElementById('status-text').innerText = "جاهز للمسح، بانتظار تذكرة...";
            document.getElementById('status-text').style.color = "#34d399";
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if(isProcessing) return; 
            isProcessing = true;
            
            html5QrcodeScanner.clear();
            
            document.getElementById('status-text').innerText = "جاري التحقق من قاعدة البيانات...";
            document.getElementById('status-text').style.color = "#f1c40f";

            try {
                const bookingsRef = ref(db, 'bookings');
                const q = query(bookingsRef, orderByChild('code'), equalTo(decodedText));
                const snapshot = await get(q);

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const seatId = Object.keys(data)[0]; 
                    const bookingDetails = data[seatId]; 

                    // --- التحقق من الاستخدام المزدوج ---
                    if (bookingDetails.scanned === true) {
                        // التذكرة استخدمت من قبل! إنذار أحمر
                        Swal.fire({
                            icon: 'error',
                            title: 'تذكرة مستخدمة مسبقاً! 🚨',
                            html: `<b>تنبيه:</b> تم تسجيل دخول صاحب هذه التذكرة بالفعل.<br><br>الاسم: <b>${bookingDetails.name}</b><br>المقعد: <b>${seatId}</b><br><br><span style="color:#e74c3c; font-size:14px;">(يُمنع الدخول بهذه التذكرة مرة أخرى)</span>`,
                            confirmButtonColor: '#c0392b',
                            confirmButtonText: 'إغلاق'
                        }).then(() => {
                            document.getElementById('rescan-btn').style.display = 'inline-block';
                            document.getElementById('status-text').innerText = "محاولة دخول متكررة (مرفوضة).";
                            document.getElementById('status-text').style.color = "#e74c3c";
                        });
                        return;
                    }

                    // --- التذكرة سليمة ولم تستخدم بعد ---
                    // 1. تسجيل الدخول في قاعدة البيانات
                    await update(ref(db, 'bookings/' + seatId), {
                        scanned: true,
                        scannedAt: new Date().toISOString()
                    });

                    // 2. إظهار رسالة النجاح
                    Swal.fire({
                        icon: 'success',
                        title: 'تذكرة صحيحة ومقبولة',
                        html: `الاسم: <b>${bookingDetails.name}</b><br>رقم المقعد: <b style="color:#2ecc71; font-size:22px;">${seatId}</b>`,
                        confirmButtonColor: '#2ecc71',
                        confirmButtonText: 'إدخال الزائر ✔️'
                    }).then(() => {
                        document.getElementById('rescan-btn').style.display = 'inline-block';
                        document.getElementById('status-text').innerText = "تم تسجيل الدخول بنجاح.";
                    });

                } else {
                    // الكود غير موجود (تذكرة مزورة)
                    Swal.fire({
                        icon: 'error',
                        title: 'تذكرة غير صالحة!',
                        text: 'هذا الكود غير مسجل في النظام أو تم إلغاء حجزه.',
                        confirmButtonColor: '#e74c3c',
                        confirmButtonText: 'حسناً'
                    }).then(() => {
                        document.getElementById('rescan-btn').style.display = 'inline-block';
                        document.getElementById('status-text').innerText = "تذكرة مرفوضة.";
                        document.getElementById('status-text').style.color = "#e74c3c";
                    });
                }
            } catch (error) {
                Swal.fire('خطأ في النظام', error.message, 'error');
                document.getElementById('rescan-btn').style.display = 'inline-block';
            }
        }

        function onScanFailure(error) { }

        window.onload = initScanner;
    </script>
</body>
</html>
