<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول (Scanner) | مسرح المقر البابوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root { --primary: #2c3e50; --accent: #1abc9c; --danger: #e74c3c; --success: #27ae60; --warning: #f39c12; }
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f7; margin: 0; color: #333; }
        
        #main-app { display: none; padding-bottom: 20px; }

        /* شريط حالة الاتصال */
        #connection-status {
            background-color: var(--success); color: white; text-align: center; padding: 8px;
            font-size: 14px; font-weight: bold; transition: background-color 0.3s;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status-offline { background-color: var(--danger) !important; }
        .status-syncing { background-color: var(--warning) !important; }

        .header { background: var(--primary); color: white; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 800; }
        .header p { margin: 5px 0 0 0; font-size: 12px; color: #bdc3c7; }

        .container { max-width: 500px; margin: 0 auto; padding: 0 15px; }

        .scanner-card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; border: 2px solid #ecf0f1; }
        .scanner-card h3 { margin: 0 0 15px 0; font-size: 16px; color: var(--primary); }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px dashed var(--accent); }

        .manual-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #ecf0f1; }
        .manual-card h3 { margin: 0 0 15px 0; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        .input-group { display: flex; gap: 10px; }
        .input-group input { flex: 1; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; font-family: inherit; font-weight: bold; text-align: center; outline: none; text-transform: uppercase; }
        .input-group input:focus { border-color: var(--accent); }
        .btn-check { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 8px; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; transition: 0.3s; }
        .btn-check:hover { background: #1a252f; }
        
        .sync-badge { font-size: 12px; background: white; color: var(--primary); padding: 2px 8px; border-radius: 12px; margin-right: 10px; display: none; }

        #reader__dashboard_section_csr span { display: none !important; }
    </style>
</head>
<body>

    <div id="main-app">
        <!-- شريط حالة الإنترنت -->
        <div id="connection-status">
            🟢 متصل بالإنترنت (Live)
            <span id="sync-counter" class="sync-badge">0 معلق</span>
        </div>

        <div class="header">
            <h1>🛡️ بوابة الدخول الإلكترونية</h1>
            <p>Rave Technology Solutions - مسرح المقر البابوي</p>
        </div>

        <div class="container">
            <div class="manual-card">
                <h3>⌨️ إدخال كود التذكرة يدوياً</h3>
                <div class="input-group">
                    <input type="text" id="manual-code" placeholder="أدخل الكود هنا...">
                    <button class="btn-check" onclick="handleManualSubmit()">تحقق</button>
                </div>
            </div>

            <div class="scanner-card">
                <h3>📷 مسح الـ QR Code</h3>
                <div id="reader"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        Swal.fire({
            title: 'دخول فريق الأمن', input: 'password', inputPlaceholder: 'كلمة المرور...',
            allowOutsideClick: false, allowEscapeKey: false, confirmButtonText: 'دخول', confirmButtonColor: '#2c3e50'
        }).then((result) => {
            if (result.value === 'avatege2019') {
                document.getElementById('main-app').style.display = 'block';
                initApp();
            } else {
                document.body.innerHTML = '<h2 style="text-align:center; margin-top:100px; color:#e74c3c;">خطأ في كلمة المرور. يرجى تحديث الصفحة.</h2>';
            }
        });

        let db;
        let html5QrcodeScanner;
        // مصفوفة لتخزين العمليات المعلقة أثناء انقطاع الإنترنت
        let offlineSyncQueue = JSON.parse(localStorage.getItem('offlineSyncQueue')) || [];

        function initApp() {
            const firebaseConfig = {
                apiKey: "AIzaSyAFsvO799G0wlZiRjD4g5GiRGIZm27ANzw",
                authDomain: "test-49b8c.firebaseapp.com",
                projectId: "test-49b8c",
                storageBucket: "test-49b8c.firebasestorage.app",
                messagingSenderId: "658085082590",
                appId: "1:658085082590:web:632f798dca5a87e2da994f",
                measurementId: "G-G0SHP0PBR0",
                databaseURL: "https://test-49b8c-default-rtdb.firebaseio.com"
            };
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);

            // استماع دائم لقاعدة البيانات لتحديث النسخة المحلية (طول ما فيه نت)
            onValue(ref(db, 'bookings'), (snapshot) => {
                if (navigator.onLine) {
                    const data = snapshot.val() || {};
                    // حفظ البيانات في الذاكرة المحلية لاستخدامها وقت انقطاع النت
                    localStorage.setItem('cachedBookings', JSON.stringify(data));
                }
            });

            // تشغيل الكاميرا
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);

            // مراقبة حالة الإنترنت
            window.addEventListener('online', handleOnlineStatus);
            window.addEventListener('offline', handleOfflineStatus);
            
            // تحديث الواجهة المبدئي
            if (!navigator.onLine) handleOfflineStatus();
            else handleOnlineStatus();
        }

        function handleOfflineStatus() {
            const statusBar = document.getElementById('connection-status');
            statusBar.className = 'status-offline';
            statusBar.innerHTML = `🔴 وضع عدم الاتصال (أوفلاين) - جاري العمل بالذاكرة المحلية <span id="sync-counter" class="sync-badge"></span>`;
            updateSyncCounter();
        }

        async function handleOnlineStatus() {
            const statusBar = document.getElementById('connection-status');
            statusBar.className = 'status-syncing';
            statusBar.innerHTML = `🔄 جاري مزامنة البيانات...`;
            
            // رفع البيانات المتأخرة
            if (offlineSyncQueue.length > 0) {
                try {
                    const updates = {};
                    offlineSyncQueue.forEach(seatId => {
                        updates[`/bookings/${seatId}/status`] = 'attended';
                        updates[`/bookings/${seatId}/attendedAt`] = new Date().toISOString();
                    });
                    
                    await update(ref(db), updates);
                    
                    // تفريغ طابور الانتظار بعد نجاح الرفع
                    offlineSyncQueue = [];
                    localStorage.setItem('offlineSyncQueue', JSON.stringify(offlineSyncQueue));
                } catch (error) {
                    console.error("فشل في المزامنة", error);
                }
            }

            statusBar.className = '';
            statusBar.innerHTML = `🟢 متصل بالإنترنت (Live) <span id="sync-counter" class="sync-badge" style="display:none;"></span>`;
        }

        function updateSyncCounter() {
            const counterElement = document.getElementById('sync-counter');
            if (counterElement) {
                if (offlineSyncQueue.length > 0) {
                    counterElement.style.display = 'inline-block';
                    counterElement.innerText = `${offlineSyncQueue.length} معلق`;
                } else {
                    counterElement.style.display = 'none';
                }
            }
        }

        window.handleManualSubmit = function() {
            const codeInput = document.getElementById('manual-code').value.trim().toUpperCase();
            if(!codeInput) return Swal.fire('تنبيه', 'يرجى كتابة الكود أولاً', 'warning');
            processTicketCode(codeInput);
            document.getElementById('manual-code').value = ''; 
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.pause();
            processTicketCode(decodedText.trim().toUpperCase());
        }

        function onScanFailure(error) { /* تجاهل الأخطاء العادية للكاميرا */ }

        async function processTicketCode(codeToVerify) {
            // جلب البيانات من الذاكرة المحلية (Cache) دايماً لضمان السرعة القصوى سواء أونلاين أو أوفلاين
            let cachedBookings = JSON.parse(localStorage.getItem('cachedBookings')) || {};
            
            let foundSeat = null;
            let ticketData = null;

            for (const seatId in cachedBookings) {
                if (cachedBookings[seatId].code && cachedBookings[seatId].code.toUpperCase() === codeToVerify) {
                    foundSeat = seatId;
                    ticketData = cachedBookings[seatId];
                    break;
                }
            }

            if (ticketData) {
                if (ticketData.status === 'attended') {
                    // التذكرة مستخدمة من قبل
                    Swal.fire({
                        icon: 'error',
                        title: 'تذكرة مستخدمة مسبقاً! ❌',
                        html: `مقعد: <b>${foundSeat}</b><br>الاسم: ${ticketData.name}<br>تم دخول هذا الشخص بالفعل.`,
                        confirmButtonText: 'موافق',
                        confirmButtonColor: '#e74c3c'
                    }).then(() => { if(html5QrcodeScanner.getState() === 2) html5QrcodeScanner.resume(); });
                } else {
                    // التذكرة صالحة - تسجيل الدخول
                    
                    // 1. تحديث الذاكرة المحلية فوراً (عشان لو عمل سكان نفس التذكرة وهو لسه أوفلاين تترفض)
                    cachedBookings[foundSeat].status = 'attended';
                    localStorage.setItem('cachedBookings', JSON.stringify(cachedBookings));

                    // 2. تحديث السيرفر أو طابور الانتظار بناءً على حالة النت
                    if (navigator.onLine) {
                        try {
                            await update(ref(db, `bookings/${foundSeat}`), { status: 'attended', attendedAt: new Date().toISOString() });
                        } catch (error) {
                            // لو النت فصل في اللحظة دي، ضيفها للطابور
                            offlineSyncQueue.push(foundSeat);
                            localStorage.setItem('offlineSyncQueue', JSON.stringify(offlineSyncQueue));
                            updateSyncCounter();
                        }
                    } else {
                        // أوفلاين: إضافة لقائمة الانتظار
                        if (!offlineSyncQueue.includes(foundSeat)) {
                            offlineSyncQueue.push(foundSeat);
                            localStorage.setItem('offlineSyncQueue', JSON.stringify(offlineSyncQueue));
                            updateSyncCounter();
                        }
                    }

                    // 3. إظهار رسالة النجاح فوراً
                    Swal.fire({
                        icon: 'success',
                        title: 'تذكرة صالحة - دخول ✅',
                        html: `مقعد: <b>${foundSeat}</b><br>الاسم: ${ticketData.name}<br>تفضل بالدخول.`,
                        confirmButtonText: 'التالي',
                        confirmButtonColor: '#27ae60',
                        timer: 2000 // تقفل أوتوماتيك بعد ثانيتين لسرعة الشغل
                    }).then(() => { if(html5QrcodeScanner.getState() === 2) html5QrcodeScanner.resume(); });
                }
            } else {
                // كود مزيف أو غير موجود
                Swal.fire({
                    icon: 'warning',
                    title: 'كود غير صحيح! ⚠️',
                    text: 'هذا الكود غير مسجل في قاعدة البيانات.',
                    confirmButtonText: 'موافق',
                    confirmButtonColor: '#f39c12'
                }).then(() => { if(html5QrcodeScanner.getState() === 2) html5QrcodeScanner.resume(); });
            }
        }
    </script>
</body>
</html>
