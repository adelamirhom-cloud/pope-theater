<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | مسرح المقر البابوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Cairo', sans-serif; background-color: #f5f7fa; 
            margin: 0; color: #2c3e50; 
        }
        
        .admin-header {
            background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 20px 30px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-wrap: wrap; gap: 15px;
        }
        .admin-title { margin: 0; font-size: 24px; font-weight: 700; color: #f1c40f; display: flex; align-items: center; gap: 10px; }
        .role-badge { font-size: 12px; background: #e74c3c; color: white; padding: 4px 10px; border-radius: 12px; }
        .header-buttons { display: flex; gap: 10px; flex-wrap: wrap;}
        
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px; font-family: 'Cairo', sans-serif;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px;
        }
        .btn-scanner { background-color: #9b59b6; }
        .btn-scanner:hover { background-color: #8e44ad; }
        .btn-export { background-color: #27ae60; }
        .btn-export:hover { background-color: #2ecc71; }
        .btn-print { background-color: #5d6d7e; }
        .btn-print:hover { background-color: #34495e; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }

        .dashboard-stats { display: flex; gap: 20px; padding: 25px 30px; flex-wrap: wrap; justify-content: center; }
        .stat-card {
            background: white; padding: 20px; border-radius: 15px; min-width: 150px; flex: 1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid #3498db;
        }
        .stat-card h3 { margin: 0; color: #7f8c8d; font-size: 15px; }
        .stat-card .num { font-size: 32px; font-weight: 700; color: #2c3e50; margin: 10px 0 0 0; }
        .stat-attended { border-color: #2ecc71; }
        .stat-pending { border-color: #f39c12; }
        .stat-percentage { border-color: #9b59b6; }

        .controls-section {
            display: flex; gap: 20px; padding: 0 30px 20px 30px; flex-wrap: wrap;
        }
        .control-box {
            background: white; padding: 20px; border-radius: 15px; flex: 1; min-width: 300px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #ecf0f1;
        }
        .control-box h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        
        .vip-form { display: flex; gap: 10px; flex-wrap: wrap; }
        .vip-form input {
            flex: 1; padding: 10px 15px; border: 2px solid #ecf0f1; border-radius: 8px; font-family: inherit;
        }
        .btn-vip { background-color: #f39c12; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; }
        
        .table-container {
            background: white; margin: 0 30px 30px 30px; border-radius: 15px;
            padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow-x: auto;
        }
        .search-bar {
            width: 100%; padding: 12px 15px; font-size: 16px; border: 2px solid #ecf0f1;
            border-radius: 10px; margin-bottom: 20px; font-family: inherit; box-sizing: border-box;
        }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border-bottom: 1px solid #ecf0f1; font-size: 14px;}
        th { background-color: #f8f9fa; color: #34495e; font-weight: 700; }
        tr:hover { background-color: #fdfefe; }
        
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: 700; }
        .badge-confirmed { background-color: #fef9e7; color: #f39c12; }
        .badge-attended { background-color: #eafaf1; color: #27ae60; }
        .badge-vip { background-color: #f4ecf7; color: #8e44ad; }

        .action-btn {
            background: #3498db; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
        }
        .action-btn:hover { background: #2980b9; }
        .action-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

        @media (max-width: 768px) {
            .admin-header, .controls-section { padding: 15px; flex-direction: column; }
            .dashboard-stats, .table-container { margin: 15px; padding: 15px; }
            .vip-form { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="main-content" style="display: none;">
        <div class="admin-header">
            <h1 class="admin-title">
                لوحة التحكم ⚙️ 
                <span id="role-badge" class="role-badge">Admin</span>
            </h1>
            <div class="header-buttons">
                <button class="btn btn-scanner" onclick="window.location.href='Scanner.html'">📷 ماسح التذاكر</button>
                <button class="btn btn-print" onclick="printGuestList()">🖨️ طباعة الكشف</button>
                <!-- زرار الإكسيل مخفي افتراضياً للأمن وهيظهر للأدمن بس -->
                <button id="btn-export" class="btn btn-export" onclick="exportCSV()" style="display: none;">📊 تحميل Excel</button>
            </div>
        </div>

        <!-- قسم الإحصائيات (مخفي للأمن) -->
        <div id="admin-stats" class="dashboard-stats" style="display: none;">
            <div class="stat-card">
                <h3>إجمالي الحجوزات</h3>
                <p class="num"><span id="total-booked">0</span> / 403</p>
            </div>
            <div class="stat-card stat-percentage">
                <h3>نسبة الإشغال</h3>
                <p class="num" id="booking-percentage">0%</p>
            </div>
            <div class="stat-card stat-attended">
                <h3>حضور مؤكد</h3>
                <p class="num" id="total-attended">0</p>
            </div>
            <div class="stat-card stat-pending">
                <h3>في الانتظار</h3>
                <p class="num" id="total-pending">0</p>
            </div>
        </div>

        <!-- قسم التحكم الخطر (مخفي للأمن) -->
        <div id="admin-controls" class="controls-section" style="display: none;">
            <div class="control-box">
                <h3>👑 حجز VIP (مباشر من الإدارة)</h3>
                <div class="vip-form">
                    <input type="text" id="vip-seat" placeholder="رقم المقعد (مثال: A5)">
                    <input type="text" id="vip-name" placeholder="اسم الضيف الـ VIP">
                    <button class="btn-vip" onclick="bookVIP()">تأكيد الحجز</button>
                </div>
            </div>
            <div class="control-box" style="border-color: #fadbd8; background-color: #fdf2e9;">
                <h3 style="color: #c0392b;">⚠️ منطقة الخطر</h3>
                <p style="font-size: 13px; color: #7f8c8d; margin-top: 0;">هذا الزر سيقوم بمسح جميع الحجوزات وإعادة تعيين النظام بالكامل.</p>
                <button class="btn btn-danger" style="width: 100%; justify-content: center;" onclick="wipeSystem()">🗑️ مسح المسرح بالكامل</button>
            </div>
        </div>

        <div class="table-container">
            <input type="text" id="search-input" class="search-bar" placeholder="🔍 ابحث بالاسم، رقم المقعد، أو الكود..." onkeyup="filterTable()">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>المقعد</th>
                        <th>الاسم</th>
                        <th>الكود</th>
                        <th>تاريخ الحجز</th>
                        <th>الحالة</th>
                        <th>إجراء يدوي</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- البيانات هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // تحديد الهوية بناءً على كلمة المرور
        Swal.fire({
            title: 'تسجيل الدخول', input: 'password', inputPlaceholder: 'أدخل كلمة المرور...',
            allowOutsideClick: false, allowEscapeKey: false, confirmButtonText: 'دخول', confirmButtonColor: '#2c3e50'
        }).then((result) => {
            const pwd = result.value;
            // تحديث الباسوردات هنا بناءً على طلبك
            if (pwd === 'avatege2019') {
                // مدير عام (Super Admin)
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('admin-stats').style.display = 'flex';
                document.getElementById('admin-controls').style.display = 'flex';
                document.getElementById('btn-export').style.display = 'flex';
                document.getElementById('role-badge').innerText = 'Super Admin';
                document.getElementById('role-badge').style.background = '#e74c3c';
            } else if (pwd === 'tanzem1') {
                // موظف أمن / تنظيم (Usher)
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('role-badge').innerText = 'فريق التنظيم';
                document.getElementById('role-badge').style.background = '#3498db';
                // الإحصائيات والتحكم وزر الإكسيل هتفضل مخفية
            } else {
                document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px; color:#e74c3c;">خطأ في كلمة المرور. يرجى تحديث الصفحة.</h2>';
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAFsvO799G0wlZiRjD4g5GiRGIZm27ANzw",
            authDomain: "test-49b8c.firebaseapp.com",
            projectId: "test-49b8c",
            storageBucket: "test-49b8c.firebasestorage.app",
            messagingSenderId: "658085082590",
            appId: "1:658085082590:web:632f798dca5a87e2da994f",
            measurementId: "G-G0SHP0PBR0",
            databaseURL: "https://test-49b8c-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let bookingsData = {};
        const TOTAL_SEATS = 403;

        function getSortedSeats() {
            return Object.keys(bookingsData).sort((a, b) => {
                return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
            });
        }

        onValue(ref(db, 'bookings'), (snapshot) => {
            bookingsData = snapshot.val() || {};
            renderTable();
        });

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            let total = 0; let attended = 0; let pending = 0;
            const sortedSeats = getSortedSeats();

            sortedSeats.forEach(seatId => {
                const info = bookingsData[seatId];
                total++;
                if (info.status === 'attended') attended++; else pending++;

                const tr = document.createElement('tr');
                
                let statusBadge = info.status === 'attended' 
                    ? '<span class="badge badge-attended">حضر ✅</span>' 
                    : '<span class="badge badge-confirmed">في الانتظار ⏳</span>';

                let codeBadge = info.code === 'VIP' 
                    ? '<span class="badge badge-vip">👑 VIP</span>' 
                    : info.code;

                let actionBtn = info.status === 'attended'
                    ? `<button class="action-btn" disabled>تم التأكيد</button>`
                    : `<button class="action-btn" onclick="confirmManualAttendance('${seatId}', '${info.name}')">تأكيد الحضور</button>`;

                const dateObj = new Date(info.bookedAt);
                const formattedDate = dateObj.toLocaleDateString('ar-EG') + ' ' + dateObj.toLocaleTimeString('ar-EG');

                tr.innerHTML = `
                    <td style="font-weight:bold; color:#2980b9;">${seatId}</td>
                    <td>${info.name}</td>
                    <td>${codeBadge}</td>
                    <td dir="ltr" style="font-size:12px;">${formattedDate}</td>
                    <td>${statusBadge}</td>
                    <td>${actionBtn}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-booked').innerText = total;
            document.getElementById('total-attended').innerText = attended;
            document.getElementById('total-pending').innerText = pending;
            
            const percentage = ((total / TOTAL_SEATS) * 100).toFixed(1);
            document.getElementById('booking-percentage').innerText = percentage + '%';
        }

        window.confirmManualAttendance = function(seatId, name) {
            Swal.fire({
                title: 'تأكيد الحضور يدوياً؟',
                text: `هل أنت متأكد من إثبات حضور "${name}" لمقعد ${seatId}؟`,
                icon: 'question', showCancelButton: true, confirmButtonColor: '#27ae60', cancelButtonColor: '#e74c3c',
                confirmButtonText: 'تأكيد', cancelButtonText: 'إلغاء'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await update(ref(db), { [`/bookings/${seatId}/status`]: 'attended', [`/bookings/${seatId}/attendedAt`]: new Date().toISOString() });
                    Swal.fire('تم!', 'تم التسجيل بنجاح.', 'success');
                }
            });
        }

        window.bookVIP = async function() {
            const seat = document.getElementById('vip-seat').value.trim().toUpperCase();
            const name = document.getElementById('vip-name').value.trim();
            if (!seat || !name) return Swal.fire('خطأ', 'أدخل المقعد والاسم', 'error');

            const seatRef = ref(db, `bookings/${seat}`);
            const snap = await get(seatRef);
            if (snap.exists()) return Swal.fire('عفواً', 'هذا المقعد محجوز بالفعل!', 'warning');

            await update(ref(db), {
                [`/bookings/${seat}`]: { name: name, code: 'VIP', bookedAt: new Date().toISOString(), status: 'confirmed' }
            });
            
            Swal.fire('تم الحجز', `تم حجز مقعد ${seat} للضيف ${name}`, 'success');
            document.getElementById('vip-seat').value = ''; document.getElementById('vip-name').value = '';
        }

        window.wipeSystem = function() {
            Swal.fire({
                title: 'تحذير شديد الخطورة! 🚨', text: 'هل أنت متأكد أنك تريد مسح جميع الحجوزات وإعادة المسرح للصفر؟',
                icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6',
                confirmButtonText: 'نعم، امسح كل شيء!', cancelButtonText: 'إلغاء'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await remove(ref(db, 'bookings')); await remove(ref(db, 'usedCodes')); await remove(ref(db, 'lockedSeats'));
                    Swal.fire('تم المسح', 'المسرح الآن فارغ تماماً.', 'success');
                }
            });
        }

        window.filterTable = function() {
            const filter = document.getElementById('search-input').value.toUpperCase();
            const trs = document.getElementById('table-body').getElementsByTagName('tr');
            for (let i = 0; i < trs.length; i++) {
                let txtValue = trs[i].textContent || trs[i].innerText;
                trs[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        window.exportCSV = function() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFFالمقعد,الاسم,الكود,الحالة,تاريخ الحجز\n";
            const sortedSeats = getSortedSeats(); 
            
            sortedSeats.forEach(seatId => {
                const info = bookingsData[seatId];
                let statusAr = info.status === 'attended' ? 'حضر' : 'في الانتظار';
                csvContent += `${seatId},${info.name},${info.code},${statusAr},${info.bookedAt}\n`;
            });
            
            const link = document.createElement("a"); link.href = encodeURI(csvContent);
            link.download = "Bookings_Report.csv"; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        window.printGuestList = function() {
            if (Object.keys(bookingsData).length === 0) {
                return Swal.fire('عفواً', 'لا يوجد حجوزات لطباعتها حتى الآن.', 'info');
            }

            const sortedSeats = getSortedSeats(); 

            let printContent = `
                <html>
                <head>
                    <title>كشف حضور مسرح المقر البابوي</title>
                    <style>
                        body { font-family: Arial, sans-serif; direction: rtl; padding: 20px; }
                        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #000; padding-bottom: 10px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
                        th, td { border: 1px solid #000; padding: 10px; text-align: center; }
                        th { background-color: #f2f2f2; font-weight: bold; }
                        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #555; }
                    </style>
                </head>
                <body>
                    <h2>📋 كشف حضور مسرح المقر البابوي (22 سبتمبر 2026)</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>رقم المقعد</th>
                                <th>اسم الحاجز</th>
                                <th>الكود / نوع الحجز</th>
                                <th>التوقيع (للمطابقة اليدوية)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            let counter = 1;
            sortedSeats.forEach(seatId => {
                const info = bookingsData[seatId];
                printContent += `
                    <tr>
                        <td>${counter++}</td>
                        <td style="font-weight: bold; font-size: 16px;">${seatId}</td>
                        <td>${info.name}</td>
                        <td>${info.code === 'VIP' ? 'VIP 👑' : info.code}</td>
                        <td></td>
                    </tr>
                `;
            });

            printContent += `
                        </tbody>
                    </table>
                    <div class="footer">
                        تم إنشاء هذا الكشف بواسطة نظام <strong>Rave Technology</strong> - إجمالي الحجوزات: ${counter - 1}
                    </div>
                </body>
                </html>
            `;

            const printWindow = window.open('', '_blank', 'width=800,height=600');
            printWindow.document.write(printContent);
            printWindow.document.close();
            
            setTimeout(() => { printWindow.print(); }, 500);
        }
    </script>
</body>
</html>
