<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | مسرح المقر البابوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f5f7fa; 
            margin: 0; 
            color: #2c3e50; 
            display: none; /* مخفي لحد ما نكتب الباسورد */
        }
        
        .admin-header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white; padding: 20px 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-wrap: wrap; gap: 15px;
        }
        
        .admin-title { margin: 0; font-size: 24px; font-weight: 700; color: #f1c40f; }
        
        .header-buttons { display: flex; gap: 10px; flex-wrap: wrap;}
        
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px; font-family: 'Cairo', sans-serif;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; color: white;
            display: flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .btn-scanner { background-color: #9b59b6; }
        .btn-scanner:hover { background-color: #8e44ad; }
        .btn-export { background-color: #27ae60; }
        .btn-export:hover { background-color: #2ecc71; }
        
        .dashboard-stats {
            display: flex; gap: 20px; padding: 25px 30px; flex-wrap: wrap; justify-content: center;
        }
        .stat-card {
            background: white; padding: 20px; border-radius: 15px; min-width: 200px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; flex: 1;
            border-bottom: 4px solid #3498db;
        }
        .stat-card h3 { margin: 0; color: #7f8c8d; font-size: 16px; }
        .stat-card .num { font-size: 36px; font-weight: 700; color: #2c3e50; margin: 10px 0 0 0; }
        .stat-attended { border-color: #2ecc71; }
        .stat-pending { border-color: #f39c12; }

        .table-container {
            background: white; margin: 20px 30px; border-radius: 15px;
            padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        
        .search-bar {
            width: 100%; padding: 12px 15px; font-size: 16px; border: 2px solid #ecf0f1;
            border-radius: 10px; margin-bottom: 20px; font-family: inherit; box-sizing: border-box;
        }

        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 15px; border-bottom: 1px solid #ecf0f1; }
        th { background-color: #f8f9fa; color: #34495e; font-weight: 700; }
        tr:hover { background-color: #fdfefe; }
        
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .badge-confirmed { background-color: #fef9e7; color: #f39c12; }
        .badge-attended { background-color: #eafaf1; color: #27ae60; }

        .action-btn {
            background: #3498db; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
        }
        .action-btn:hover { background: #2980b9; }
        .action-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

        @media (max-width: 768px) {
            .admin-header { flex-direction: column; text-align: center; }
            .dashboard-stats { padding: 15px; }
            .table-container { margin: 15px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1 class="admin-title">لوحة التحكم ⚙️</h1>
        <div class="header-buttons">
            <!-- زرار الانتقال للماسح -->
            <button class="btn btn-scanner" onclick="window.location.href='Scanner.html'">📷 ماسح التذاكر</button>
            <button class="btn btn-export" onclick="exportCSV()">📊 تحميل Excel</button>
        </div>
    </div>

    <div class="dashboard-stats">
        <div class="stat-card">
            <h3>إجمالي الحجوزات</h3>
            <p class="num" id="total-booked">0</p>
        </div>
        <div class="stat-card stat-attended">
            <h3>حضور مؤكد (تم المسح)</h3>
            <p class="num" id="total-attended">0</p>
        </div>
        <div class="stat-card stat-pending">
            <h3>في الانتظار</h3>
            <p class="num" id="total-pending">0</p>
        </div>
    </div>

    <div class="table-container">
        <input type="text" id="search-input" class="search-bar" placeholder="🔍 ابحث بالاسم، رقم المقعد، أو الكود..." onkeyup="filterTable()">
        
        <table id="data-table">
            <thead>
                <tr>
                    <th>المقعد</th>
                    <th>الاسم</th>
                    <th>الكود</th>
                    <th>تاريخ الحجز</th>
                    <th>الحالة</th>
                    <th>إجراء يدوي</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- البيانات هتنزل هنا -->
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // طلب الباسورد قبل عرض الصفحة
        Swal.fire({
            title: 'تسجيل الدخول',
            input: 'password',
            inputPlaceholder: 'أدخل كلمة المرور...',
            allowOutsideClick: false,
            allowEscapeKey: false,
            confirmButtonText: 'دخول',
            confirmButtonColor: '#2c3e50'
        }).then((result) => {
            if (result.value === 'rave2026') {
                document.body.style.display = 'block';
                Swal.fire({ icon: 'success', title: 'مرحباً بك', timer: 1000, showConfirmButton: false });
            } else {
                document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px; color:#e74c3c;">خطأ في كلمة المرور. يرجى تحديث الصفحة.</h2>';
                document.body.style.display = 'block';
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAFsvO799G0wlZiRjD4g5GiRGIZm27ANzw",
            authDomain: "test-49b8c.firebaseapp.com",
            projectId: "test-49b8c",
            storageBucket: "test-49b8c.firebasestorage.app",
            messagingSenderId: "658085082590",
            appId: "1:658085082590:web:632f798dca5a87e2da994f",
            measurementId: "G-G0SHP0PBR0",
            databaseURL: "https://test-49b8c-default-rtdb.firebaseio.com"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let bookingsData = {};

        // جلب البيانات من فايربيز
        onValue(ref(db, 'bookings'), (snapshot) => {
            bookingsData = snapshot.val() || {};
            renderTable();
        });

        // رسم الجدول وتحديث الإحصائيات
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            let total = 0; let attended = 0; let pending = 0;

            for (const [seatId, info] of Object.entries(bookingsData)) {
                total++;
                if (info.status === 'attended') attended++; else pending++;

                const tr = document.createElement('tr');
                
                // تنسيق الحالة
                let statusBadge = info.status === 'attended' 
                    ? '<span class="badge badge-attended">حضر ✅</span>' 
                    : '<span class="badge badge-confirmed">في الانتظار ⏳</span>';

                // تنسيق زر الإجراء اليدوي
                let actionBtn = info.status === 'attended'
                    ? `<button class="action-btn" disabled>تم التأكيد</button>`
                    : `<button class="action-btn" onclick="confirmManualAttendance('${seatId}', '${info.name}')">تأكيد الحضور</button>`;

                const dateObj = new Date(info.bookedAt);
                const formattedDate = dateObj.toLocaleDateString('ar-EG') + ' ' + dateObj.toLocaleTimeString('ar-EG');

                tr.innerHTML = `
                    <td style="font-weight:bold; color:#2980b9;">${seatId}</td>
                    <td>${info.name}</td>
                    <td>${info.code}</td>
                    <td dir="ltr" style="font-size:12px;">${formattedDate}</td>
                    <td>${statusBadge}</td>
                    <td>${actionBtn}</td>
                `;
                tbody.appendChild(tr);
            }

            document.getElementById('total-booked').innerText = total;
            document.getElementById('total-attended').innerText = attended;
            document.getElementById('total-pending').innerText = pending;
        }

        // دالة تأكيد الحضور اليدوي
        window.confirmManualAttendance = function(seatId, name) {
            Swal.fire({
                title: 'تأكيد الحضور يدوياً؟',
                text: `هل أنت متأكد من إثبات حضور "${name}" لمقعد ${seatId}؟`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#27ae60',
                cancelButtonColor: '#e74c3c',
                confirmButtonText: 'نعم، تأكيد دخوله',
                cancelButtonText: 'إلغاء'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const updates = {};
                        updates['/bookings/' + seatId + '/status'] = 'attended';
                        updates['/bookings/' + seatId + '/attendedAt'] = new Date().toISOString();
                        
                        await update(ref(db), updates);
                        Swal.fire('تم التحديث!', 'تم تسجيل حضور الشخص بنجاح.', 'success');
                    } catch (error) {
                        Swal.fire('خطأ', 'حدث مشكلة في الاتصال.', 'error');
                    }
                }
            });
        }

        // فلترة الجدول (Search)
        window.filterTable = function() {
            const filter = document.getElementById('search-input').value.toUpperCase();
            const trs = document.getElementById('table-body').getElementsByTagName('tr');
            for (let i = 0; i < trs.length; i++) {
                let tdSeat = trs[i].getElementsByTagName('td')[0];
                let tdName = trs[i].getElementsByTagName('td')[1];
                let tdCode = trs[i].getElementsByTagName('td')[2];
                if (tdSeat || tdName || tdCode) {
                    let txtValue = (tdSeat.textContent || tdSeat.innerText) + " " + 
                                   (tdName.textContent || tdName.innerText) + " " + 
                                   (tdCode.textContent || tdCode.innerText);
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        trs[i].style.display = "";
                    } else {
                        trs[i].style.display = "none";
                    }
                }
            }
        }

        // استخراج البيانات Excel (CSV)
        window.exportCSV = function() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // لدعم العربي
            csvContent += "المقعد,الاسم,الكود,الحالة,تاريخ الحجز\n";
            
            for (const [seatId, info] of Object.entries(bookingsData)) {
                let statusAr = info.status === 'attended' ? 'حضر' : 'في الانتظار';
                csvContent += `${seatId},${info.name},${info.code},${statusAr},${info.bookedAt}\n`;
            }
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Bookings_Report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
